name: "📋 Task"
description: A unit of work with enough context for a human or an agent to execute.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters; the user-facing goal.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / constraints
      description: Edge cases, guardrails, links to docs.
