name: "🐞 Bug report"
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security vulnerabilities** do **not** open a public issue —
        see [SECURITY.md](https://github.com/RikepilB/build4venezuela-projecthub/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected versus what actually happened.
      placeholder: I searched for "X" and …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Which locale?
      options:
        - "Both /es and /en"
        - "/es only"
        - "/en only"
        - "Not locale-specific"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser / OS / device, and live site vs. local dev.
      placeholder: Chrome 130, Windows, elumbralvzla.org
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console errors
      description: Optional — paste any console output or screenshots.
