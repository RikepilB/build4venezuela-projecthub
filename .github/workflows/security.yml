name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift scan — catches newly disclosed CVEs / leaked secrets with no new commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so a secret in any past commit is caught
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action is free for public repos under a personal account — no license key needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Scan
        # Tokenless: pinned registry rulesets. Findings are reported via SARIF (not hard-failed),
        # so pre-existing issues surface in the Security tab without blocking PRs.
        run: >
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/react
          --config p/secrets
          --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
