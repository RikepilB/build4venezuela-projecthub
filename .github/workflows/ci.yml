name: CI
on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege — CI only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  workspace-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/workspace.spec.ts tests/e2e/shared-workspace.spec.ts tests/e2e/board.spec.ts tests/e2e/home.spec.ts tests/e2e/mobile-nav.spec.ts tests/e2e/social-preview.spec.ts tests/e2e/quick-start.spec.ts tests/e2e/public-flows.spec.ts --workers=2
